[project]
name = "bimcanvas-agent"
version = "0.1.0"
description = "BIMCanvas PlacementAgent - AI-powered interior layout assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk==0.1.41",  # Agent SDK (ThinkingConfig + effort + 未知消息类型兼容)
    "openai-agents>=0.14.1,<1",  # OpenAI Agents SDK（RunState + ToolApprovalItem 暂停恢复）
    "aiohttp>=3.9.0",           # HTTP server
    "aiohttp-cors>=0.7.0",      # CORS support for Web access
    "Pillow>=10.4.0",           # 图片标准化（缩放 / 降采样 / 格式兜底）
    "python-dotenv>=1.0.0",     # Environment variables
    "pyyaml>=6.0",              # SKILL.md frontmatter parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
bimcanvas-agent = "src.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "bimcanvas_plugin_sdk*"]
