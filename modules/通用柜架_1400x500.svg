<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Main Top Surface -->
  <rect x="12.5" y="12.5" width="1375" height="475" rx="5" class="main-lines" />
  
  <!-- Vertical Dividers (Visible from top as lines across) -->
  <line x1="466" y1="12.5" x2="466" y2="487.5" class="detail-lines" />
  <line x1="933" y1="12.5" x2="933" y2="487.5" class="detail-lines" />
</svg>
