<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 2000">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Bed Frame -->
  <rect x="12.5" y="12.5" width="1275" height="1975" rx="15" class="main-lines" />
  
  <!-- Headboard -->
  <rect x="12.5" y="12.5" width="1275" height="150" rx="15" class="main-lines" />
  
  <!-- Pillow (Centered) -->
  <rect x="300" y="250" width="700" height="400" rx="30" class="detail-lines" />
  
  <!-- Duvet / Sheet (Folded back) -->
  <path d="M 12.5 850 C 300 800, 600 900, 1287.5 850" class="detail-lines" />
  
  <!-- Bed Runner (Bottom) -->
  <line x1="12.5" y1="1800" x2="1287.5" y2="1800" class="detail-lines" />
</svg>
