<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Lamp Shade (Top View) -->
  <circle cx="250" cy="250" r="237.5" class="main-lines" />
  
  <!-- Base / Bulb -->
  <circle cx="250" cy="250" r="40" class="detail-lines" fill="#000000"/>
  
  <!-- Arm / Stand Indication (Crosshair) -->
  <line x1="250" y1="150" x2="250" y2="350" class="detail-lines" opacity="0.3"/>
  <line x1="150" y1="250" x2="350" y2="250" class="detail-lines" opacity="0.3"/>
</svg>
