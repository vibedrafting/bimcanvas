<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Main Body -->
  <rect x="12.5" y="12.5" width="575" height="595" rx="5" class="main-lines" />
  
  <!-- Control Panel / Backsplash (Rear) -->
  <rect x="12.5" y="12.5" width="575" height="80" rx="2" class="detail-lines" />
  
  <!-- Door / Lid (Top View - Circle for top loader or front loader door projection?) -->
  <!-- Usually front loader plan view is just a rect, maybe with a slight curve at front. 
       Let's assume front loader but show the top surface details. -->
  <!-- Or if it's a top loader, a lid. Let's do a generic top surface. -->
  
  <!-- Door swing arc (optional, but might clutter). Let's just show the top surface. -->
  <!-- Circle for the drum/lid area -->
  <circle cx="300" cy="350" r="180" class="detail-lines" opacity="0.5"/>
  
  <!-- Detergent Drawer (Front Left) -->
  <rect x="30" y="550" width="100" height="50" rx="2" class="detail-lines" />
</svg>
