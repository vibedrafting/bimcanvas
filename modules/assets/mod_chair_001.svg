<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 500">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Seat (Round) -->
  <circle cx="215" cy="280" r="200" class="main-lines" />
  
  <!-- Low Backrest -->
  <path d="M 50 200 Q 215 50, 380 200" class="main-lines" />
  
  <!-- Footrest Ring Indication -->
  <circle cx="215" cy="280" r="120" class="detail-lines" opacity="0.5"/>
</svg>
