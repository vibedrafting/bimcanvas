<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 350">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Main Body -->
  <rect x="12.5" y="12.5" width="505" height="325" rx="5" class="main-lines" />
  
  <!-- Air Outlet (Front) -->
  <rect x="65" y="280" width="400" height="40" rx="2" class="detail-lines" />
  
  <!-- Control Panel (Top) -->
  <circle cx="450" cy="80" r="20" class="detail-lines" />
</svg>
