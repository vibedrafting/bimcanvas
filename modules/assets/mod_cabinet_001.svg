<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Main Top Surface -->
  <rect x="12.5" y="12.5" width="1175" height="475" rx="5" class="main-lines" />
  
  <!-- Lower Level / Open Shelf Indication (Dashed or lighter rect) -->
  <!-- Since we can't use dashed lines per rules, we use a lighter inner rect to imply a lower shelf visible from top or just the top surface detail -->
  <rect x="400" y="12.5" width="400" height="475" class="detail-lines" opacity="0.4"/>
</svg>
