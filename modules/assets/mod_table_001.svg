<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Table Top Outer -->
  <rect x="12.5" y="12.5" width="1575" height="875" rx="10" class="main-lines" />
  
  <!-- Table Top Inner Edge -->
  <rect x="60" y="60" width="1480" height="780" rx="5" class="detail-lines" opacity="0.6"/>
  
  <!-- Table Runner (Optional decoration to distinguish dining table) -->
  <rect x="600" y="12.5" width="400" height="875" class="detail-lines" stroke-dasharray="none" opacity="0.4"/>
</svg>
