<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2000">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Bed Frame / Mattress Outline -->
  <rect x="12.5" y="12.5" width="1775" height="1975" rx="15" class="main-lines" />

  <!-- Headboard Area -->
  <rect x="12.5" y="12.5" width="1775" height="150" rx="15" class="main-lines" />
  
  <!-- Pillows -->
  <rect x="150" y="250" width="700" height="400" rx="30" class="detail-lines" />
  <rect x="950" y="250" width="700" height="400" rx="30" class="detail-lines" />

  <!-- Duvet / Bed Cover -->
  <!-- Simple, clean curve for the sheet -->
  <path d="M 12.5 850 
           C 400 800, 600 900, 900 850 
           S 1400 800, 1787.5 850" class="detail-lines" />

  <!-- Bed Runner (Optional, kept simple) -->
  <line x1="12.5" y1="1800" x2="1787.5" y2="1800" class="detail-lines" />

</svg>
