<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Main Body (Back part) -->
  <rect x="12.5" y="12.5" width="875" height="700" rx="5" class="main-lines" />
  
  <!-- Doors (Front part, sticking out) -->
  <!-- Left Door -->
  <rect x="12.5" y="712.5" width="430" height="75" rx="5" class="main-lines" />
  <!-- Right Door -->
  <rect x="457.5" y="712.5" width="430" height="75" rx="5" class="main-lines" />
  
  <!-- Handles (Indicated on the inner edges of doors) -->
  <line x1="420" y1="795" x2="420" y2="730" class="detail-lines" />
  <line x1="480" y1="795" x2="480" y2="730" class="detail-lines" />
</svg>
