<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 450">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Main Top Surface -->
  <rect x="12.5" y="12.5" width="1975" height="425" rx="5" class="main-lines" />
  
  <!-- Inner Edge (Chamfer/Thickness) -->
  <rect x="40" y="40" width="1920" height="370" rx="2" class="detail-lines" opacity="0.6"/>
  
  <!-- Cable Hole (Rear Center) -->
  <circle cx="1000" cy="50" r="25" class="detail-lines" />
</svg>
