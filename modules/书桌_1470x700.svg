<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1470 700">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Desk Top -->
  <rect x="12.5" y="12.5" width="1445" height="675" rx="10" class="main-lines" />
  
  <!-- Inner Work Area (Double border effect) -->
  <rect x="50" y="50" width="1370" height="600" rx="5" class="detail-lines" opacity="0.6"/>
  
  <!-- Cable Grommet / Tech Hole -->
  <circle cx="735" cy="60" r="20" class="detail-lines" />
  
  <!-- Drawer Unit Indication (Right side) -->
  <line x1="1000" y1="50" x2="1000" y2="650" class="detail-lines" opacity="0.5"/>
</svg>
