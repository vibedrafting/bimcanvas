<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1810 1810">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Main Platform -->
  <rect x="12.5" y="12.5" width="1785" height="1785" rx="5" class="main-lines" />
  
  <!-- Tatami Mat Layout (4-mat pattern or similar) -->
  <line x1="905" y1="12.5" x2="905" y2="1797.5" class="detail-lines" />
  <line x1="12.5" y1="905" x2="1797.5" y2="905" class="detail-lines" />
  
  <!-- Inner Mat Borders (Subtle) -->
  <rect x="50" y="50" width="805" height="805" class="detail-lines" opacity="0.5"/>
  <rect x="955" y="50" width="805" height="805" class="detail-lines" opacity="0.5"/>
  <rect x="50" y="955" width="805" height="805" class="detail-lines" opacity="0.5"/>
  <rect x="955" y="955" width="805" height="805" class="detail-lines" opacity="0.5"/>
</svg>
