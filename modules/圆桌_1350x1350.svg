<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1350">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Table Top Edge (Outer) -->
  <circle cx="675" cy="675" r="662.5" class="main-lines" />
  
  <!-- Table Top Bevel/Inner Edge (Distinguishes it as a table) -->
  <circle cx="675" cy="675" r="600" class="detail-lines" opacity="0.6"/>
  
  <!-- Center Base Indication (Subtle cross or small circle) -->
  <circle cx="675" cy="675" r="20" class="detail-lines" />
</svg>
