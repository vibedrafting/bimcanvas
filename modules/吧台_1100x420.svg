<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Main Counter Top -->
  <rect x="12.5" y="12.5" width="1075" height="395" rx="5" class="main-lines" />
  
  <!-- Upper Serving Shelf (Narrower, usually on the guest side) -->
  <rect x="12.5" y="12.5" width="1075" height="120" rx="5" class="detail-lines" />
  
  <!-- Work Surface (Lower area) -->
  <!-- Sink Indication -->
  <rect x="200" y="180" width="300" height="180" rx="5" class="detail-lines" />
  <circle cx="350" cy="270" r="15" class="detail-lines" /> <!-- Drain -->
  
  <!-- Faucet -->
  <path d="M 350 180 L 350 220" class="detail-lines" />
</svg>
