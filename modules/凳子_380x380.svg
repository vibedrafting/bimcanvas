<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Main Seat (Round) -->
  <circle cx="190" cy="190" r="177.5" class="main-lines" />
  
  <!-- Inner Detail (Tuft or Ring to distinguish from table) -->
  <circle cx="190" cy="190" r="20" class="detail-lines" fill="#000000"/>
  
  <!-- 4 "Leg" positions indicated by small marks or cross -->
  <line x1="190" y1="50" x2="190" y2="330" class="detail-lines" opacity="0.3"/>
  <line x1="50" y1="190" x2="330" y2="190" class="detail-lines" opacity="0.3"/>
</svg>
