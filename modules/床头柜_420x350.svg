<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 350">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Outer Frame -->
  <rect x="12.5" y="12.5" width="395" height="325" rx="5" class="main-lines" />
  
  <!-- Inner Frame (Offset) -->
  <rect x="50" y="50" width="320" height="250" rx="2" class="detail-lines" />
  
  <!-- Lamp Circle -->
  <circle cx="210" cy="175" r="80" class="detail-lines" />
  
  <!-- Crosshair -->
  <line x1="110" y1="175" x2="310" y2="175" class="detail-lines" />
  <line x1="210" y1="75" x2="210" y2="275" class="detail-lines" />
</svg>
