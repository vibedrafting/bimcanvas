  <!-- Armrests -->
  <rect x="12.5" y="162.5" width="120" height="485" rx="15" class="detail-lines" />
  <rect x="627.5" y="162.5" width="120" height="485" rx="15" class="detail-lines" />
  
  <!-- Seat Cushion -->
