<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- L-Shaped Dressing Table -->
  <path d="M 12.5 12.5 L 1187.5 12.5 L 1187.5 500 L 500 500 L 500 987.5 L 12.5 987.5 Z" class="main-lines" />
  
  <!-- Mirror Indication (on the wider part) -->
  <rect x="100" y="30" width="1000" height="20" rx="5" class="detail-lines" fill="#000000"/>
  
  <!-- Cosmetic Storage Area -->
  <rect x="50" y="80" width="300" height="300" rx="5" class="detail-lines" opacity="0.5"/>
</svg>
