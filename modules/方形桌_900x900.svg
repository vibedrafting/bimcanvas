<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <defs>
    <style>
      .main-lines { fill: none; stroke: #000000; stroke-width: 25; stroke-linecap: round; stroke-linejoin: round; }
      .detail-lines { fill: none; stroke: #000000; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Table Top -->
  <rect x="12.5" y="12.5" width="875" height="875" rx="10" class="main-lines" />
  
  <!-- Inner Edge -->
  <rect x="60" y="60" width="780" height="780" rx="5" class="detail-lines" opacity="0.6"/>
  
  <!-- Center Decoration -->
  <rect x="350" y="350" width="200" height="200" rx="2" class="detail-lines" opacity="0.4"/>
</svg>
