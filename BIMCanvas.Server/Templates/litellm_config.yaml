      model: gemini/gemini-3.1-pro-preview
      api_base: https://css.youngala.com/v1beta
      api_key: sk-715fca35f0d602ed381e2a43e48797ba257dd0b0114cc78af0fad63124d8e499
  - model_name: bc-gemini_sub2api-sonnet
    litellm_params:
